<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #212121;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <canvas id="neuralCanvas"></canvas>

    <script>
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');

        // Use screen dimensions for pre-generation, viewport for display
        const screenW = window.screen.width;
        const screenH = window.screen.height;
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const mouse = { x: width / 2, y: height / 2 };

        // Material Design grays
        const colors = {
            bg: '#212121',
            neuronLight: '#BDBDBD',
            neuronMid: '#9E9E9E',
            neuronDark: '#757575'
        };

        // Density-based neuron calculation (neurons per million pixels)
        // Ensures consistent density across all screen sizes
        const DENSITY = 55; // neurons per million pixels
        const screenArea = screenW * screenH;
        const totalNeurons = Math.round((screenArea / 1000000) * DENSITY);

        // Layer distribution ratios
        const layerRatios = [0.19, 0.33, 0.48]; // background, mid, foreground
        const neuronsPerLayer = layerRatios.map(ratio => Math.max(3, Math.round(totalNeurons * ratio)));

        class Neuron {
            constructor(layer) {
                this.layer = layer;
                // Simple random distribution across full screen
                this.baseX = Math.random() * screenW;
                this.baseY = Math.random() * screenH;
                this.x = this.baseX;
                this.y = this.baseY;
                this.vx = 0;
                this.vy = 0;

                // REVERSED Depth properties - far = larger, foggy
                const reversedLayer = 2 - layer; // Reverse: 0->2, 1->1, 2->0
                this.size = 8 + (reversedLayer * 6); // Far neurons much larger: 20, 14, 8
                this.maxSpeed = 0.3 + (layer * 0.2); // Near neurons move more
                this.returnForce = 0.015 + (layer * 0.01);
                this.repelRadius = 80 + (layer * 40);
                this.repelForce = 1.5 + (layer * 0.8);

                // Connection distances per layer
                this.maxConnectionDist = layer === 0 ? 300 : layer === 1 ? 250 : 200;

                // Color based on depth - far is foggy/lighter
                if (layer === 0) { // Background - far, large, foggy
                    this.color = colors.neuronLight;
                    this.alpha = 0.25;
                    this.blur = 8;
                } else if (layer === 1) { // Mid
                    this.color = colors.neuronMid;
                    this.alpha = 0.45;
                    this.blur = 3;
                } else { // Foreground - near, small, sharp
                    this.color = colors.neuronDark;
                    this.alpha = 0.7;
                    this.blur = 0;
                }
            }

            update() {
                // Calculate distance to mouse
                const dx = this.x - mouse.x;
                const dy = this.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                // Repel from mouse if within radius
                if (dist < this.repelRadius && dist > 0) {
                    const force = (1 - dist / this.repelRadius) * this.repelForce;
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                }

                // Return to base position
                const returnDx = this.baseX - this.x;
                const returnDy = this.baseY - this.y;
                this.vx += returnDx * this.returnForce;
                this.vy += returnDy * this.returnForce;

                // Apply friction
                this.vx *= 0.92;
                this.vy *= 0.92;

                // Limit speed
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > this.maxSpeed) {
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }

                // Update position
                this.x += this.vx;
                this.y += this.vy;
            }

            drawConnectionTo(other) {
                const dist = Math.sqrt(
                    (this.x - other.x) ** 2 + (this.y - other.y) ** 2
                );
                const maxDist = this.layer === 0 ? 250 : this.layer === 1 ? 200 : 150;

                if (dist < maxDist && dist > 0) {
                    const alpha = (1 - dist / maxDist) * this.alpha * 0.3;

                    // Calculate connection points on neuron surfaces
                    const angle = Math.atan2(other.y - this.y, other.x - this.x);
                    const startX = this.x + Math.cos(angle) * this.size;
                    const startY = this.y + Math.sin(angle) * this.size;
                    const endX = other.x - Math.cos(angle) * other.size;
                    const endY = other.y - Math.sin(angle) * other.size;

                    // Create organic curve with random offset for vibrating effect
                    const midX = (startX + endX) / 2 + (Math.random() - 0.5) * 20;
                    const midY = (startY + endY) / 2 + (Math.random() - 0.5) * 20;

                    // Draw tapered connection using gradient
                    const gradient = ctx.createLinearGradient(startX, startY, endX, endY);
                    const color = this.color;
                    gradient.addColorStop(0, `${color}00`);
                    gradient.addColorStop(0.15, color);
                    gradient.addColorStop(0.85, color);
                    gradient.addColorStop(1, `${color}00`);

                    ctx.globalAlpha = alpha;
                    ctx.strokeStyle = gradient;

                    // Thicker connections for far neurons
                    const lineWidth = this.layer === 0 ? 3 : this.layer === 1 ? 2 : 1.2;
                    ctx.lineWidth = lineWidth;
                    ctx.lineCap = 'round';

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.quadraticCurveTo(midX, midY, endX, endY);
                    ctx.stroke();
                }
            }

            draw() {
                // Draw neuron body with atmospheric glow for far neurons
                if (this.blur > 0) {
                    ctx.globalAlpha = this.alpha * 0.2;
                    ctx.fillStyle = this.color;
                    ctx.filter = `blur(${this.blur}px)`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.filter = 'none';
                }

                // Main neuron body
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Inner core highlight
                ctx.globalAlpha = this.alpha * 0.6;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create layers of neurons with density-based counts
        const layers = [[], [], []];

        for (let layer = 0; layer < 3; layer++) {
            for (let i = 0; i < neuronsPerLayer[layer]; i++) {
                layers[layer].push(new Neuron(layer));
            }
        }

        // Drag state
        let draggedNeuron = null;

        // Find neuron under cursor
        // Priority: core hit (front to back) > halo hit (front to back)
        function getNeuronAt(x, y) {
            // First pass: check cores (front layers first)
            for (let l = 2; l >= 0; l--) {
                for (const neuron of layers[l]) {
                    const dx = neuron.x - x;
                    const dy = neuron.y - y;
                    if (dx * dx + dy * dy <= neuron.size * neuron.size) {
                        return neuron;
                    }
                }
            }
            // Second pass: check halos (front layers first)
            for (let l = 2; l >= 0; l--) {
                for (const neuron of layers[l]) {
                    const dx = neuron.x - x;
                    const dy = neuron.y - y;
                    const haloRadius = neuron.blur > 0 ? neuron.size * 2.5 : neuron.size;
                    if (dx * dx + dy * dy <= haloRadius * haloRadius) {
                        return neuron;
                    }
                }
            }
            return null;
        }

        // Mouse tracking
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            if (draggedNeuron) {
                draggedNeuron.x = e.clientX;
                draggedNeuron.y = e.clientY;
            }
        });

        window.addEventListener('mousedown', (e) => {
            const neuron = getNeuronAt(e.clientX, e.clientY);
            if (neuron) {
                draggedNeuron = neuron;
                draggedNeuron.hidden = true;
            }
        });

        window.addEventListener('mouseup', () => {
            if (draggedNeuron) {
                draggedNeuron.baseX = draggedNeuron.x;
                draggedNeuron.baseY = draggedNeuron.y;
                draggedNeuron.vx = 0;
                draggedNeuron.vy = 0;
                draggedNeuron.hidden = false;
                draggedNeuron = null;
            }
        });

        // Handle resize - just update canvas, neurons are pre-generated for full screen
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Animation loop with dynamic connections
        function animate() {
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            // Draw layers from back to front (0 = far/large, 2 = near/small)
            [0, 1, 2].forEach(layerIndex => {
                ctx.filter = 'none';
                const layer = layers[layerIndex];

                // Update all neurons first (skip dragged neuron)
                layer.forEach(neuron => {
                    if (neuron !== draggedNeuron) neuron.update();
                });

                // Dynamic connections - check all pairs in this layer
                for (let i = 0; i < layer.length; i++) {
                    for (let j = i + 1; j < layer.length; j++) {
                        const neuron = layer[i];
                        const other = layer[j];
                        if (neuron.hidden || other.hidden) continue;
                        const dist = Math.sqrt(
                            (neuron.x - other.x) ** 2 + (neuron.y - other.y) ** 2
                        );
                        if (dist < neuron.maxConnectionDist) {
                            neuron.drawConnectionTo(other);
                        }
                    }
                }

                // Draw all neuron bodies (skip hidden/dragged)
                layer.forEach(neuron => { if (!neuron.hidden) neuron.draw(); });
            });

            ctx.filter = 'none';
            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
