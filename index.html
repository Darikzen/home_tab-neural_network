<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #212121;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .hudLabel {
            position: fixed;
            top: 8px;
            font-family: ui-monospace, 'Cascadia Mono', 'Cascadia Code', 'Courier New', monospace;
            font-size: 18pt;
            letter-spacing: 0.08em;
            color: #ffffff;
            opacity: 0;
            transition: opacity 0.5s ease;
            user-select: none;
            cursor: inherit;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hudLabel:hover {
            opacity: 0.5;
        }

        #seedLabel {
            left: 8px;
        }

        #coordLabel {
            right: 8px;
        }

        .copyIcon {
            opacity: 0;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <canvas id="neuralCanvas"></canvas>
    <div id="seedLabel" class="hudLabel">
        <span id="seedText"></span>
        <span class="copyIcon">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="3.5" y="0.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
                <rect x="0.5" y="3.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="#212121"/>
            </svg>
        </span>
    </div>
    <div id="coordLabel" class="hudLabel">
        <span id="coordText"></span>
        <span class="copyIcon">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
                <rect x="3.5" y="0.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
                <rect x="0.5" y="3.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="#212121"/>
            </svg>
        </span>
    </div>

    <script>
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');

        // Custom crosshair: 4 short lines, empty center, neuron-halo gray
        const _cursorSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><line x1="16" y1="3" x2="16" y2="11" stroke="#BDBDBD" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/><line x1="16" y1="21" x2="16" y2="29" stroke="#BDBDBD" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/><line x1="3" y1="16" x2="11" y2="16" stroke="#BDBDBD" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/><line x1="21" y1="16" x2="29" y2="16" stroke="#BDBDBD" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/></svg>`;
        const customCursor = `url("data:image/svg+xml,${encodeURIComponent(_cursorSVG)}") 16 16, crosshair`;
        document.documentElement.style.cursor = customCursor;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // World-space mouse position (converted from screen each frame)
        const mouse = { x: width / 2, y: height / 2 };

        // ── Camera ──────────────────────────────────────────────────────────
        const camera = { x: 0, y: 0, zoom: 1 };
        const MIN_ZOOM = 0.15;
        const MAX_ZOOM = 8;

        // Pan state
        let isPanning = false;
        let panStart  = { x: 0, y: 0 };
        let panOrigin = { x: 0, y: 0 };

        function screenToWorld(sx, sy) {
            return {
                x: (sx - camera.x) / camera.zoom,
                y: (sy - camera.y) / camera.zoom
            };
        }

        // Visible world rect (with padding so edge neurons aren't clipped)
        function getViewport() {
            const pad = 120;
            return {
                left:   (-camera.x / camera.zoom) - pad,
                top:    (-camera.y / camera.zoom) - pad,
                right:  ((width  - camera.x) / camera.zoom) + pad,
                bottom: ((height - camera.y) / camera.zoom) + pad
            };
        }

        // Material Design grays
        const colors = {
            bg: '#212121',
            neuronLight: '#BDBDBD',
            neuronMid: '#9E9E9E',
            neuronDark: '#757575'
        };

        // ── Spatial chunking ────────────────────────────────────────────────
        const DENSITY    = 55;
        const CHUNK_SIZE = 600;
        const NEURONS_PER_CHUNK = Math.max(4, Math.round(DENSITY * (CHUNK_SIZE * CHUNK_SIZE) / 1_000_000));

        const layerRatios = [0.19, 0.33, 0.48];

        // Random once per page load — makes every session look different
        const SESSION_SEED = (Math.random() * 0xFFFFFF) | 0;
        const _seedHex = SESSION_SEED.toString(16).toUpperCase().padStart(6, '0');
        document.getElementById('seedText').textContent = _seedHex;

        const coordTextEl = document.getElementById('coordText');
        let _coordStr = '0, 0';

        function formatCoords(x, y) {
            return `${Math.round(x)}, ${Math.round(y)}`;
        }

        function updateCoordLabel() {
            _coordStr = formatCoords(mouse.x, mouse.y);
            coordTextEl.textContent = _coordStr;
        }

        function setMouseWorld(w) {
            mouse.x = w.x;
            mouse.y = w.y;
            updateCoordLabel();
        }

        function setupCopyLabel(labelEl, getText) {
            labelEl.addEventListener('click', () => {
                navigator.clipboard?.writeText(getText());
                const icon = labelEl.querySelector('.copyIcon');
                icon.style.transition = 'opacity 0.15s ease';
                icon.style.opacity    = '1';
                clearTimeout(icon._fadeTimer);
                icon._fadeTimer = setTimeout(() => {
                    icon.style.transition = 'opacity 1.0s ease';
                    icon.style.opacity    = '0';
                }, 600);
            });
        }

        setupCopyLabel(document.getElementById('seedLabel'), () => _seedHex);
        setupCopyLabel(document.getElementById('coordLabel'), () => _coordStr);
        updateCoordLabel();

        // Deterministic hash: maps (chunk coords + layer + index + field) → [0, 1)
        function chunkRand(cx, cy, layer, i, field) {
            let s = (cx * 73856093 ^ cy * 19349663 ^ layer * 83492791 ^ i * 2654435761 ^ field * 123456789 ^ SESSION_SEED) >>> 0;
            s = Math.imul(s ^ (s >>> 16), 0x45d9f3b) >>> 0;
            s = Math.imul(s ^ (s >>> 16), 0x45d9f3b) >>> 0;
            return ((s ^ (s >>> 16)) >>> 0) / 0xFFFFFFFF;
        }

        class Neuron {
            constructor(layer) {
                this.layer = layer;
                // baseX/baseY/x/y are set by generateChunk after construction
                this.baseX = 0; this.baseY = 0;
                this.x = 0;     this.y = 0;
                this.vx = 0;    this.vy = 0;
                this.pinned = false;
                this.dragScale   = 1.0;
                this.brightScale = 1.0;

                // REVERSED depth — far = larger, foggy
                const reversedLayer = 2 - layer;
                this.size         = 8 + (reversedLayer * 6);
                this.maxSpeed     = 0.3 + (layer * 0.2);
                this.maxSpeedSq   = this.maxSpeed * this.maxSpeed;  // OPT: avoid sqrt in common case
                this.returnForce  = 0.015 + (layer * 0.01);
                this.repelRadius  = 80 + (layer * 40);
                this.repelRadiusSq = this.repelRadius * this.repelRadius; // OPT: squared for guard check
                this.repelForce   = 1.5 + (layer * 0.8);

                // Inner draw threshold (actual line alpha fade distance)
                this.maxDrawDist    = layer === 0 ? 250 : layer === 1 ? 200 : 150;
                this.maxDrawDistSq  = this.maxDrawDist * this.maxDrawDist;
                // Outer cull threshold (skip pair if further than this)
                this.maxConnectionDistSq = (layer === 0 ? 300 : layer === 1 ? 250 : 200) ** 2;

                if (layer === 0) {
                    this.color = colors.neuronLight;
                    this.alpha = 0.25;
                    this.blur  = 8;
                } else if (layer === 1) {
                    this.color = colors.neuronMid;
                    this.alpha = 0.45;
                    this.blur  = 3;
                } else {
                    this.color = colors.neuronDark;
                    this.alpha = 0.7;
                    this.blur  = 0;
                }
            }

            // skipRepel: true while panning so the world-mouse jump doesn't scatter neurons
            update(skipRepel) {
                if (!this.pinned) {
                    // Drift: slowly move the rest position so the network is never fully static.
                    // Y uses a 1.3× freq ratio → Lissajous figure-8 paths instead of circles.
                    const t = performance.now();
                    this.baseX = this.originX + Math.sin(t * this.driftFreq       + this.driftPhaseX) * this.driftAmpX;
                    this.baseY = this.originY + Math.sin(t * this.driftFreq * 1.3 + this.driftPhaseY) * this.driftAmpY;
                }

                if (!skipRepel) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    // OPT: squared guard avoids sqrt for the ~95% of neurons outside repel radius
                    const distSq = dx * dx + dy * dy;
                    if (distSq < this.repelRadiusSq && distSq > 0) {
                        const dist  = Math.sqrt(distSq);
                        const force = (1 - dist / this.repelRadius) * this.repelForce;
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                }

                if (!this.pinned) {
                    const returnDx = this.baseX - this.x;
                    const returnDy = this.baseY - this.y;
                    this.vx += returnDx * this.returnForce;
                    this.vy += returnDy * this.returnForce;
                }

                this.vx *= 0.92;
                this.vy *= 0.92;

                // OPT: squared guard avoids sqrt when already within speed limit
                const speedSq = this.vx * this.vx + this.vy * this.vy;
                if (speedSq > this.maxSpeedSq) {
                    const speed = Math.sqrt(speedSq);
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;

                this.dragScale   += (1.0 - this.dragScale)   * 0.1;
                this.brightScale += (1.0 - this.brightScale) * 0.1;
            }

            // Cheap AABB — world coords, includes halo radius
            isInViewport(vp) {
                const r = this.size * this.dragScale * 3;
                return this.x + r > vp.left && this.x - r < vp.right &&
                       this.y + r > vp.top  && this.y - r < vp.bottom;
            }

            // dist is passed in from the outer loop (already computed, sqrt already taken)
            drawConnectionTo(other, dist) {
                if (dist >= this.maxDrawDist) return;

                const alpha = (1 - dist / this.maxDrawDist) * this.alpha * 0.3;
                const angle  = Math.atan2(other.y - this.y, other.x - this.x);
                const startX = this.x  + Math.cos(angle) * this.size  * this.dragScale;
                const startY = this.y  + Math.sin(angle) * this.size  * this.dragScale;
                const endX   = other.x - Math.cos(angle) * other.size * other.dragScale;
                const endY   = other.y - Math.sin(angle) * other.size * other.dragScale;

                const midX = (startX + endX) / 2 + (Math.random() - 0.5) * 20;
                const midY = (startY + endY) / 2 + (Math.random() - 0.5) * 20;

                // OPT: solid stroke + globalAlpha instead of createLinearGradient per frame.
                // Visually near-identical at these low alpha values; eliminates gradient
                // object allocation and GPU gradient pipeline per connection.
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = this.color;
                ctx.lineWidth   = this.layer === 0 ? 3 : this.layer === 1 ? 2 : 1.2;
                ctx.lineCap     = 'round';

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(midX, midY, endX, endY);
                ctx.stroke();
            }

            draw() {
                // OPT: radial gradient replaces ctx.filter='blur(Xpx)'.
                // filter changes flush the entire canvas rasterizer; createRadialGradient
                // for ~5 neurons/frame is far cheaper.
                if (this.blur > 0) {
                    const r    = this.size * this.dragScale * 2.5 + this.blur * 1.5;
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                    grad.addColorStop(0,   this.color);
                    grad.addColorStop(0.4, this.color);
                    grad.addColorStop(1,   this.color + '00');
                    ctx.globalAlpha = this.alpha * this.brightScale * 0.2;
                    ctx.fillStyle   = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = this.alpha * this.brightScale;
                ctx.fillStyle   = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.dragScale, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = this.alpha * this.brightScale * 0.6;
                ctx.fillStyle   = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.dragScale * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ── Chunk management ────────────────────────────────────────────────

        const activeChunks = new Map();
        let lastChunkKeys  = new Set();

        // OPT: cached per-layer neuron arrays — only rebuilt when chunks change,
        // not every frame. Eliminates 3 array allocations + N push() calls/frame.
        const neuronsCache  = [[], [], []];
        let   cacheValid    = false;

        function generateChunk(cx, cy) {
            const neurons = [[], [], []];
            for (let layer = 0; layer < 3; layer++) {
                const count = Math.max(2, Math.round(NEURONS_PER_CHUNK * layerRatios[layer]));
                for (let i = 0; i < count; i++) {
                    const n = new Neuron(layer);
                    n.baseX = n.x = cx * CHUNK_SIZE + chunkRand(cx, cy, layer, i, 0) * CHUNK_SIZE;
                    n.baseY = n.y = cy * CHUNK_SIZE + chunkRand(cx, cy, layer, i, 1) * CHUNK_SIZE;

                    // Drift: each neuron's rest position slowly oscillates so the network
                    // breathes organically. Background neurons drift more (atmospheric),
                    // foreground neurons less (anchored). The existing spring returnForce
                    // chases the moving target — no physics changes needed.
                    n.originX     = n.baseX;
                    n.originY     = n.baseY;
                    const ampScale = layer === 0 ? 1.8 : layer === 1 ? 1.2 : 0.7;
                    n.driftAmpX   = (15 + chunkRand(cx, cy, layer, i, 2) * 35) * ampScale;
                    n.driftAmpY   = (15 + chunkRand(cx, cy, layer, i, 3) * 35) * ampScale;
                    n.driftFreq   = (0.03 + chunkRand(cx, cy, layer, i, 4) * 0.05) * 0.001; // full cycle ~60–180 s
                    n.driftPhaseX = chunkRand(cx, cy, layer, i, 5) * Math.PI * 2;
                    n.driftPhaseY = chunkRand(cx, cy, layer, i, 6) * Math.PI * 2;

                    neurons[layer].push(n);
                }
            }
            return { neurons };
        }

        function setsEqual(a, b) {
            if (a.size !== b.size) return false;
            for (const k of a) if (!b.has(k)) return false;
            return true;
        }

        function updateChunks(vp) {
            const buf = 1;
            const minCX = Math.floor(vp.left   / CHUNK_SIZE) - buf;
            const maxCX = Math.floor(vp.right  / CHUNK_SIZE) + buf;
            const minCY = Math.floor(vp.top    / CHUNK_SIZE) - buf;
            const maxCY = Math.floor(vp.bottom / CHUNK_SIZE) + buf;

            const required = new Set();
            for (let cx = minCX; cx <= maxCX; cx++)
                for (let cy = minCY; cy <= maxCY; cy++)
                    required.add(`${cx},${cy}`);

            if (setsEqual(required, lastChunkKeys)) return;
            lastChunkKeys = required;
            cacheValid = false; // chunks changed → rebuild neuron cache next frame

            for (const key of activeChunks.keys())
                if (!required.has(key)) activeChunks.delete(key);

            for (const key of required) {
                if (!activeChunks.has(key)) {
                    const [cx, cy] = key.split(',').map(Number);
                    activeChunks.set(key, generateChunk(cx, cy));
                }
            }
        }

        // ── Hit testing ─────────────────────────────────────────────────────

        let draggedNeuron = null;

        function pinNeuron(n) {
            n.x = n.baseX = n.originX = n.x;
            n.y = n.baseY = n.originY = n.y;
            n.vx = n.vy = 0;
            n.pinned = true;
        }

        function getNeuronAt(wx, wy) {
            for (let l = 2; l >= 0; l--) {
                for (const chunk of activeChunks.values()) {
                    for (const n of chunk.neurons[l]) {
                        const dx = n.x - wx, dy = n.y - wy;
                        if (dx * dx + dy * dy <= n.size * n.size) return n;
                    }
                }
            }
            for (let l = 2; l >= 0; l--) {
                for (const chunk of activeChunks.values()) {
                    for (const n of chunk.neurons[l]) {
                        const dx = n.x - wx, dy = n.y - wy;
                        const r = n.blur > 0 ? n.size * 2.5 : n.size;
                        if (dx * dx + dy * dy <= r * r) return n;
                    }
                }
            }
            return null;
        }

        // ── Input handlers ──────────────────────────────────────────────────

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                camera.x = panOrigin.x + (e.clientX - panStart.x);
                camera.y = panOrigin.y + (e.clientY - panStart.y);
            } else {
                const w = screenToWorld(e.clientX, e.clientY);
                setMouseWorld(w);
                if (draggedNeuron) {
                    draggedNeuron.x = w.x;
                    draggedNeuron.y = w.y;
                }
            }
        });

        window.addEventListener('mousedown', (e) => {
            const w = screenToWorld(e.clientX, e.clientY);
            const neuron = getNeuronAt(w.x, w.y);
            if (neuron) {
                draggedNeuron = neuron;
                document.documentElement.style.cursor = 'none';
            } else {
                isPanning = true;
                panStart  = { x: e.clientX, y: e.clientY };
                panOrigin = { x: camera.x,  y: camera.y  };
            }
        });

        window.addEventListener('mouseup', () => {
            if (draggedNeuron) {
                pinNeuron(draggedNeuron);
                draggedNeuron = null;
            }
            isPanning = false;
            document.documentElement.style.cursor = customCursor;
        });

        // ── Touch handling ──────────────────────────────────────────────────
        // Mirrors the mouse/wheel behaviour exactly:
        //   1 finger  → pan canvas  (or drag neuron if starting on one)
        //   2 fingers → pinch-zoom + pan simultaneously, in one transform step

        const _touch = { activeTouches: 0, prevMid: null, prevDist: 0 };

        function _touchMidDist(t1, t2) {
            const mx = (t1.clientX + t2.clientX) * 0.5;
            const my = (t1.clientY + t2.clientY) * 0.5;
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return { mx, my, dist: Math.sqrt(dx * dx + dy * dy) };
        }

        function _releaseDraggedNeuron() {
            if (!draggedNeuron) return;
            pinNeuron(draggedNeuron);
            draggedNeuron = null;
        }

        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            _touch.activeTouches = e.touches.length;

            if (e.touches.length === 1) {
                const t = e.touches[0];
                const w = screenToWorld(t.clientX, t.clientY);
                setMouseWorld(w);
                const neuron = getNeuronAt(w.x, w.y);
                if (neuron) {
                    draggedNeuron = neuron;
                } else {
                    isPanning = true;
                    panStart  = { x: t.clientX, y: t.clientY };
                    panOrigin = { x: camera.x,  y: camera.y  };
                }
            } else if (e.touches.length === 2) {
                // Second finger lands — cancel any single-touch op cleanly
                _releaseDraggedNeuron();
                isPanning = false;
                const { mx, my, dist } = _touchMidDist(e.touches[0], e.touches[1]);
                _touch.prevMid  = { x: mx, y: my };
                _touch.prevDist = dist;
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();

            if (e.touches.length === 1 && _touch.activeTouches === 1) {
                const t = e.touches[0];
                const w = screenToWorld(t.clientX, t.clientY);
                setMouseWorld(w);
                if (draggedNeuron) {
                    draggedNeuron.x = w.x;
                    draggedNeuron.y = w.y;
                } else if (isPanning) {
                    camera.x = panOrigin.x + (t.clientX - panStart.x);
                    camera.y = panOrigin.y + (t.clientY - panStart.y);
                }

            } else if (e.touches.length === 2 && _touch.prevMid) {
                const { mx, my, dist } = _touchMidDist(e.touches[0], e.touches[1]);

                // Combined pinch+pan in a single transform:
                // anchor the world point under the OLD midpoint to the NEW midpoint.
                // This handles both zoom and translate with no drift.
                const factor  = dist / _touch.prevDist;
                const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, camera.zoom * factor));
                const wx = (_touch.prevMid.x - camera.x) / camera.zoom;
                const wy = (_touch.prevMid.y - camera.y) / camera.zoom;
                camera.zoom = newZoom;
                camera.x    = mx - wx * camera.zoom;
                camera.y    = my - wy * camera.zoom;

                _touch.prevMid  = { x: mx, y: my };
                _touch.prevDist = dist;
            }
        }, { passive: false });

        function _onTouchEnd(e) {
            e.preventDefault();
            _touch.activeTouches = e.touches.length;

            if (e.touches.length < 2) {
                _touch.prevMid  = null;
                _touch.prevDist = 0;
            }

            if (e.touches.length === 0) {
                _releaseDraggedNeuron();
                isPanning = false;
            } else if (e.touches.length === 1) {
                // One finger remains after lifting second — restart single-touch pan
                isPanning = false;
                if (!draggedNeuron) {
                    isPanning = true;
                    panStart  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    panOrigin = { x: camera.x, y: camera.y };
                }
            }
        }

        window.addEventListener('touchend',    _onTouchEnd, { passive: false });
        window.addEventListener('touchcancel', _onTouchEnd, { passive: false });

        function applyZoom(factor, cx, cy) {
            const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, camera.zoom * factor));
            const wx = (cx - camera.x) / camera.zoom;
            const wy = (cy - camera.y) / camera.zoom;
            camera.zoom = newZoom;
            camera.x = cx - wx * camera.zoom;
            camera.y = cy - wy * camera.zoom;
        }

        window.addEventListener('wheel', (e) => {
            e.preventDefault();

            if (e.ctrlKey) {
                const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
                applyZoom(factor, e.clientX, e.clientY);
                return;
            }

            const isMouseWheel = e.deltaMode !== 0 ||
                                 (e.deltaX === 0 && Math.abs(e.deltaY) >= 40);

            if (isMouseWheel) {
                const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
                applyZoom(factor, e.clientX, e.clientY);
            } else {
                camera.x -= e.deltaX;
                camera.y -= e.deltaY;
            }
        }, { passive: false });

        window.addEventListener('resize', () => {
            width  = canvas.width  = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // ── Render loop ─────────────────────────────────────────────────────

        function animate() {
            // 1. Clear
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            // 2. Apply camera transform
            ctx.setTransform(camera.zoom, 0, 0, camera.zoom, camera.x, camera.y);

            const vp = getViewport();

            // 3. Load/unload chunks
            updateChunks(vp);

            // 4. OPT: rebuild neuron cache only when chunks changed, not every frame
            if (!cacheValid) {
                neuronsCache[0].length = 0;
                neuronsCache[1].length = 0;
                neuronsCache[2].length = 0;
                for (const chunk of activeChunks.values())
                    for (let l = 0; l < 3; l++)
                        for (const n of chunk.neurons[l])
                            neuronsCache[l].push(n);
                cacheValid = true;
            }

            // 5. Update, connect, draw — layer by layer (back → front)
            for (let layerIndex = 0; layerIndex < 3; layerIndex++) {
                ctx.filter = 'none';
                const layer = neuronsCache[layerIndex];

                // OPT: physics only for visible neurons — off-screen ones are at rest
                // (return force settles them fast when they re-enter view)
                for (const neuron of layer) {
                    if (neuron !== draggedNeuron && neuron.isInViewport(vp))
                        neuron.update(isPanning);
                }

                // Inflate dragged neuron
                if (draggedNeuron && draggedNeuron.layer === layerIndex) {
                    draggedNeuron.dragScale  += (1.07 - draggedNeuron.dragScale)  * 0.1;
                    draggedNeuron.brightScale += (1.1  - draggedNeuron.brightScale) * 0.1;
                }

                // Connections — OPT: squared distance check avoids sqrt for most pairs;
                // sqrt only taken for the subset that actually gets drawn
                for (let i = 0; i < layer.length; i++) {
                    const a = layer[i];
                    if (!a.isInViewport(vp)) continue; // skip entirely off-screen neurons
                    for (let j = i + 1; j < layer.length; j++) {
                        const b = layer[j];
                        const dx = a.x - b.x, dy = a.y - b.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq >= a.maxConnectionDistSq) continue;
                        if (!b.isInViewport(vp)) continue; // skip if other end is off-screen
                        a.drawConnectionTo(b, Math.sqrt(distSq));
                    }
                }

                // Draw neurons — skip if outside viewport
                for (const neuron of layer) {
                    if (neuron.isInViewport(vp)) neuron.draw();
                }
            }

            // 6. Reset
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.filter = 'none';
            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
