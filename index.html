<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #212121;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        .hudLabel {
            position: fixed;
            top: 8px;
            font-family: ui-monospace, 'Cascadia Mono', 'Cascadia Code', 'Courier New', monospace;
            font-size: clamp(11pt, 2.8vw, 18pt);
            letter-spacing: 0.08em;
            color: #ffffff;
            opacity: 0;
            transition: opacity 0.5s ease;
            user-select: none;
            cursor: inherit;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100vw - 16px);
        }

        .hudLabel:hover,
        .hudLabel:focus-within {
            opacity: 0.5;
        }

        #seedLabel {
            left: 8px;
        }

        #coordLabel {
            right: 8px;
            flex-direction: row-reverse;
        }

        .hudInput {
            font: inherit;
            letter-spacing: inherit;
            color: inherit;
            background: transparent;
            border: none;
            outline: none;
            padding: 0;
            margin: 0;
            min-width: 0;
            cursor: text;
            user-select: text;
        }

        #seedInput {
            width: 6.5em;
        }

        #coordInput {
            width: min(9em, 42vw);
            text-align: right;
        }

        .hudIconBtn {
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            min-height: 32px;
            padding: 7px;
            margin: -7px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s ease, color 0.15s ease, transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .hudLabel:hover .hudIconBtn,
        .hudLabel:focus-within .hudIconBtn {
            opacity: 0.85;
        }

        .hudIconBtn:hover {
            opacity: 1;
            color: #ffffff;
        }

        .hudIconBtn:active {
            opacity: 1;
            color: #ffffff;
            transform: scale(0.94);
        }

        .hudIconBtn.copied {
            opacity: 1;
            color: #ffffff;
        }

        .hudIconBtn .iconCopy,
        .hudIconBtn .iconCheck {
            transition: opacity 0.15s ease;
        }

        .hudIconBtn .iconCheck {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .hudIconBtn.copied .iconCopy {
            opacity: 0;
        }

        .hudIconBtn.copied .iconCheck {
            opacity: 1;
        }

        @media (hover: none) {
            .hudLabel:active .hudIconBtn {
                opacity: 0.9;
            }
        }

        .hudLabelBottom {
            top: auto;
            bottom: 8px;
        }

        #capacityLabel {
            right: 8px;
            flex-direction: row;
            justify-content: flex-end;
            gap: 10px;
        }

        #capacityText {
            cursor: pointer;
            user-select: none;
            text-align: right;
            min-width: 7em;
        }

        .capacityActions {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .hudIconBtn.infoBtn {
            cursor: pointer;
        }

        #sceneNotice {
            position: fixed;
            left: 50%;
            bottom: 8px;
            transform: translateX(-50%);
            font-family: ui-monospace, 'Cascadia Mono', 'Cascadia Code', 'Courier New', monospace;
            font-size: clamp(10pt, 2.4vw, 14pt);
            letter-spacing: 0.06em;
            color: #ffffff;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 10;
            max-width: calc(100vw - 32px);
            text-align: center;
        }

        #sceneNotice.show {
            opacity: 0.55;
        }

        #sceneInfoPanel {
            position: fixed;
            right: 8px;
            bottom: 44px;
            max-width: min(320px, calc(100vw - 16px));
            padding: 10px 12px;
            font-family: ui-monospace, 'Cascadia Mono', 'Cascadia Code', 'Courier New', monospace;
            font-size: clamp(9pt, 2.2vw, 12pt);
            line-height: 1.45;
            letter-spacing: 0.04em;
            color: #bdbdbd;
            background: rgba(33, 33, 33, 0.92);
            border: 1px solid rgba(189, 189, 189, 0.2);
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            z-index: 11;
        }

        #sceneInfoPanel.show {
            opacity: 0.65;
            pointer-events: auto;
        }

        .hudInput::selection {
            background: rgba(189, 189, 189, 0.35);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <canvas id="neuralCanvas"></canvas>
    <div id="seedLabel" class="hudLabel">
        <input id="seedInput" class="hudInput" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="7" aria-label="Seed" title="Paste or type hex seed, Enter to apply">
        <button type="button" class="hudIconBtn copyBtn" aria-label="Copy seed">
            <svg class="iconCopy" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <rect x="3.5" y="0.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
                <rect x="0.5" y="3.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="#212121"/>
            </svg>
            <svg class="iconCheck" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M3.5 7.2 5.8 9.5 10.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    <div id="coordLabel" class="hudLabel">
        <input id="coordInput" class="hudInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="View center coordinates" title="View center x, y — paste and Enter to go">
        <button type="button" class="hudIconBtn copyBtn" aria-label="Copy coordinates">
            <svg class="iconCopy" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <rect x="3.5" y="0.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
                <rect x="0.5" y="3.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="#212121"/>
            </svg>
            <svg class="iconCheck" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                <path d="M3.5 7.2 5.8 9.5 10.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
    <div id="capacityLabel" class="hudLabel hudLabelBottom">
        <span id="capacityText">0%</span>
        <div class="capacityActions">
            <button type="button" class="hudIconBtn copyBtn" id="capacityCopyBtn" aria-label="Copy share link">
                <svg class="iconCopy" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <rect x="3.5" y="0.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
                    <rect x="0.5" y="3.5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="#212121"/>
                </svg>
                <svg class="iconCheck" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <path d="M3.5 7.2 5.8 9.5 10.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button type="button" class="hudIconBtn infoBtn" id="sceneInfoBtn" aria-label="Scene capacity info">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/>
                    <circle cx="7" cy="4.35" r="0.65" fill="currentColor"/>
                    <line x1="7" y1="6.25" x2="7" y2="10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>
    <div id="sceneNotice" aria-live="polite"></div>
    <div id="sceneInfoPanel" hidden>
        Scene capacity limits how much moved-orb data fits in a share link.
        When full, the least relevant edits are dropped: tiny nudges first, then far from your art cluster, then least recently edited.
        Click the meter to cycle display: percent, bytes, orb count. Copy icon copies a share URL.
    </div>

    <script>
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');

        // Custom crosshair: 4 short lines, empty center, neuron-halo gray
        const _cursorSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><line x1="16" y1="3" x2="16" y2="11" stroke="#BDBDBD" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/><line x1="16" y1="21" x2="16" y2="29" stroke="#BDBDBD" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/><line x1="3" y1="16" x2="11" y2="16" stroke="#BDBDBD" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/><line x1="21" y1="16" x2="29" y2="16" stroke="#BDBDBD" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/></svg>`;
        const customCursor = `url("data:image/svg+xml,${encodeURIComponent(_cursorSVG)}") 16 16, crosshair`;
        document.documentElement.style.cursor = customCursor;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // World-space mouse position (converted from screen each frame)
        const mouse = { x: width / 2, y: height / 2 };

        // ── Camera ──────────────────────────────────────────────────────────
        const camera = { x: 0, y: 0, zoom: 1 };
        const MIN_ZOOM = 0.15;
        const MAX_ZOOM = 8;

        // Pan state
        let isPanning = false;
        let panStart  = { x: 0, y: 0 };
        let panOrigin = { x: 0, y: 0 };

        function screenToWorld(sx, sy) {
            return {
                x: (sx - camera.x) / camera.zoom,
                y: (sy - camera.y) / camera.zoom
            };
        }

        // Visible world rect (with padding so edge neurons aren't clipped)
        function getViewport() {
            const pad = 120;
            return {
                left:   (-camera.x / camera.zoom) - pad,
                top:    (-camera.y / camera.zoom) - pad,
                right:  ((width  - camera.x) / camera.zoom) + pad,
                bottom: ((height - camera.y) / camera.zoom) + pad
            };
        }

        // Material Design grays
        const colors = {
            bg: '#212121',
            neuronLight: '#BDBDBD',
            neuronMid: '#9E9E9E',
            neuronDark: '#757575'
        };

        // ── Spatial chunking ────────────────────────────────────────────────
        const DENSITY    = 55;
        const CHUNK_SIZE = 600;
        const NEURONS_PER_CHUNK = Math.max(4, Math.round(DENSITY * (CHUNK_SIZE * CHUNK_SIZE) / 1_000_000));

        const layerRatios = [0.19, 0.33, 0.48];

        // ── Scene persistence & sharing ─────────────────────────────────────
        const SCENE_MAX_BYTES   = 1800;
        const SCENE_MAX_ENTRIES = 100;
        const SCENE_WARN_RATIO  = 0.8;
        const SCENE_STORAGE_KEY = 'neuro-tab-scene-v1';

        const sceneOverrides = new Map();
        let _sceneByteSize   = 0;
        let _warnShown       = false;
        let _capacityMode    = parseInt(sessionStorage.getItem('capacityMode') || '0', 10) % 3;
        let _persistTimer    = null;
        let _urlSyncTimer    = null;
        let _byteSizeTimer   = null;
        let _cachedShareUrl  = '';

        const capacityTextEl = document.getElementById('capacityText');
        const sceneNoticeEl  = document.getElementById('sceneNotice');
        const sceneInfoBtn   = document.getElementById('sceneInfoBtn');
        const sceneInfoPanel = document.getElementById('sceneInfoPanel');
        let _noticeTimer     = null;

        function neuronKey(cx, cy, layer, i) {
            return `${cx},${cy}:${layer}:${i}`;
        }

        function defaultNeuronPos(cx, cy, layer, i) {
            return {
                x: cx * CHUNK_SIZE + chunkRand(cx, cy, layer, i, 0) * CHUNK_SIZE,
                y: cy * CHUNK_SIZE + chunkRand(cx, cy, layer, i, 1) * CHUNK_SIZE
            };
        }

        function getSceneAnchor() {
            if (sceneOverrides.size === 0) return getViewCenterWorld();
            let sx = 0, sy = 0;
            for (const o of sceneOverrides.values()) { sx += o.x; sy += o.y; }
            const n = sceneOverrides.size;
            return { x: sx / n, y: sy / n };
        }

        function overrideRelevance(o, anchor) {
            const disp = Math.hypot(o.x - o.ox, o.y - o.oy);
            const dist = Math.hypot(o.x - anchor.x, o.y - anchor.y);
            return disp + dist * 0.002 - o.t * 1e-9;
        }

        function regenChunkAt(cx, cy) {
            const key = `${cx},${cy}`;
            if (!activeChunks.has(key)) return;
            activeChunks.set(key, generateChunk(cx, cy));
            cacheValid = false;
        }

        function evictLeastRelevant() {
            const anchor = getSceneAnchor();
            let worstKey = null, worstScore = Infinity;
            for (const [k, o] of sceneOverrides) {
                const s = overrideRelevance(o, anchor);
                if (s < worstScore) { worstScore = s; worstKey = k; }
            }
            if (!worstKey) return false;
            const [cx, cy] = worstKey.split(':')[0].split(',').map(Number);
            sceneOverrides.delete(worstKey);
            regenChunkAt(cx, cy);
            showSceneNotice('Least relevant edit removed');
            return true;
        }

        function buildCompactScene() {
            const c = getViewCenterWorld();
            const o = [];
            for (const v of sceneOverrides.values())
                o.push([v.cx, v.cy, v.l, v.i, Math.round(v.x), Math.round(v.y)]);
            return { s: SESSION_SEED, x: Math.round(c.x), y: Math.round(c.y), z: Math.round(camera.zoom * 100) / 100, o };
        }

        async function compressScenePayload(payload) {
            const json = JSON.stringify(payload);
            if (typeof CompressionStream === 'undefined')
                return { raw: json, bytes: new TextEncoder().encode(json).length };
            const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate'));
            const buf = await new Response(stream).arrayBuffer();
            const bytes = new Uint8Array(buf);
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            const b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            return { raw: b64, bytes: bytes.length, compressed: true };
        }

        async function decompressSceneParam(q) {
            const bin = Uint8Array.from(atob(q.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
            if (typeof DecompressionStream === 'undefined') {
                return JSON.parse(q);
            }
            const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
            return JSON.parse(await new Response(stream).text());
        }

        async function refreshSceneByteSize() {
            const payload = buildCompactScene();
            if (payload.o.length === 0) {
                _sceneByteSize = 0;
                updateCapacityHud();
                return;
            }
            try {
                const r = await compressScenePayload(payload);
                _sceneByteSize = r.bytes;
            } catch {
                _sceneByteSize = new TextEncoder().encode(JSON.stringify(payload)).length;
            }
            updateCapacityHud();
        }

        function scheduleByteSizeRefresh() {
            clearTimeout(_byteSizeTimer);
            _byteSizeTimer = setTimeout(refreshSceneByteSize, 120);
        }

        function sceneBudgetRatio() {
            return Math.min(1, _sceneByteSize / SCENE_MAX_BYTES);
        }

        function formatBytes(n) {
            if (n < 1024) return `${n}B`;
            return `${(n / 1024).toFixed(1)}k`;
        }

        function updateCapacityHud() {
            const ratio = sceneBudgetRatio();
            const count = sceneOverrides.size;
            let text;
            if (_capacityMode === 1)
                text = `${formatBytes(_sceneByteSize)} / ${formatBytes(SCENE_MAX_BYTES)}`;
            else if (_capacityMode === 2)
                text = `${count} / ${SCENE_MAX_ENTRIES}`;
            else
                text = `${Math.round(ratio * 100)}%`;

            capacityTextEl.textContent = text;
            if (ratio >= SCENE_WARN_RATIO && ratio < 1)
                capacityTextEl.style.color = '#bdbdbd';
            else
                capacityTextEl.style.color = '#ffffff';
        }

        function showSceneNotice(msg) {
            sceneNoticeEl.textContent = msg;
            sceneNoticeEl.classList.add('show');
            clearTimeout(_noticeTimer);
            _noticeTimer = setTimeout(() => sceneNoticeEl.classList.remove('show'), 2800);
        }

        function checkSceneBudgetWarning() {
            const ratio = sceneBudgetRatio();
            if (ratio >= SCENE_WARN_RATIO && ratio < 1 && !_warnShown) {
                _warnShown = true;
                showSceneNotice('Approaching scene limit');
            }
            if (ratio < SCENE_WARN_RATIO * 0.9) _warnShown = false;
        }

        function clearSceneOverrides() {
            sceneOverrides.clear();
            _sceneByteSize = 0;
            _warnShown = false;
            updateCapacityHud();
            scheduleByteSizeRefresh();
        }

        function applyScenePayload(data) {
            if (typeof data.s === 'number') {
                SESSION_SEED = data.s & 0xFFFFFF;
                updateSeedDisplay();
            }
            clearSceneOverrides();
            if (Array.isArray(data.o)) {
                for (const row of data.o) {
                    if (!Array.isArray(row) || row.length < 6) continue;
                    const [cx, cy, l, i, x, y] = row;
                    const def = defaultNeuronPos(cx, cy, l, i);
                    sceneOverrides.set(neuronKey(cx, cy, l, i), {
                        cx, cy, l, i, x, y, ox: def.x, oy: def.y, t: performance.now()
                    });
                }
            }
            resetWorld();
            if (typeof data.z === 'number')
                camera.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, data.z));
            if (typeof data.x === 'number' && typeof data.y === 'number')
                centerCameraOn(data.x, data.y);
            scheduleByteSizeRefresh();
            updateCapacityHud();
        }

        function persistSceneLocal() {
            try {
                localStorage.setItem(SCENE_STORAGE_KEY, JSON.stringify(buildCompactScene()));
            } catch { /* quota */ }
        }

        function schedulePersistScene() {
            clearTimeout(_persistTimer);
            _persistTimer = setTimeout(persistSceneLocal, 400);
        }

        async function buildShareUrl() {
            const payload = buildCompactScene();
            const base = location.origin + location.pathname;
            if (!payload.o || payload.o.length === 0)
                return `${base}?s=${formatSeedHex(SESSION_SEED)}&x=${payload.x}&y=${payload.y}&z=${payload.z}`;
            try {
                const r = await compressScenePayload(payload);
                return `${base}?q=${r.raw}`;
            } catch {
                return base + '?q=' + encodeURIComponent(JSON.stringify(payload));
            }
        }

        function getShareUrlSync() {
            if (_cachedShareUrl) return _cachedShareUrl;
            const payload = buildCompactScene();
            const base = location.origin + location.pathname;
            if (!payload.o || payload.o.length === 0)
                return `${base}?s=${formatSeedHex(SESSION_SEED)}&x=${payload.x}&y=${payload.y}&z=${payload.z}`;
            return base + '?q=' + encodeURIComponent(JSON.stringify(payload));
        }

        async function refreshShareUrlCache() {
            try {
                _cachedShareUrl = await buildShareUrl();
            } catch {
                _cachedShareUrl = getShareUrlSync();
            }
        }

        function scheduleUrlSync() {
            clearTimeout(_urlSyncTimer);
            _urlSyncTimer = setTimeout(async () => {
                if (sceneOverrides.size === 0) {
                    _cachedShareUrl = '';
                    return;
                }
                try {
                    await refreshShareUrlCache();
                    const url = _cachedShareUrl;
                    if (url.length > 8000) return;
                    history.replaceState(null, '', url);
                } catch { /* ignore */ }
            }, 900);
            refreshShareUrlCache();
        }

        function saveSceneOverride(cx, cy, l, i, x, y) {
            const key = neuronKey(cx, cy, l, i);
            const def = defaultNeuronPos(cx, cy, l, i);
            const isNew = !sceneOverrides.has(key);

            if (isNew) {
                while (sceneOverrides.size >= SCENE_MAX_ENTRIES && evictLeastRelevant()) {}
            }

            sceneOverrides.set(key, { cx, cy, l, i, x, y, ox: def.x, oy: def.y, t: performance.now() });

            if (isNew) {
                scheduleByteSizeRefresh();
                setTimeout(async () => {
                    await refreshSceneByteSize();
                    while (_sceneByteSize > SCENE_MAX_BYTES && evictLeastRelevant()) {
                        await refreshSceneByteSize();
                    }
                    checkSceneBudgetWarning();
                }, 150);
            } else {
                scheduleByteSizeRefresh();
            }

            schedulePersistScene();
            scheduleUrlSync();
            updateCapacityHud();
        }

        function applyOverrideToNeuron(n, cx, cy, layer, i) {
            const o = sceneOverrides.get(neuronKey(cx, cy, layer, i));
            if (!o) return;
            n.x = n.baseX = n.originX = o.x;
            n.y = n.baseY = n.originY = o.y;
            n.vx = n.vy = 0;
            n.pinned = true;
        }

        // Random once per page load — makes every session look different
        let SESSION_SEED = (Math.random() * 0xFFFFFF) | 0;

        const seedInputEl  = document.getElementById('seedInput');
        const coordInputEl = document.getElementById('coordInput');
        let _seedHex = '';
        let _coordStr = '0, 0';
        let _coordInputFocused = false;

        function formatSeedHex(seed) {
            return seed.toString(16).toUpperCase().padStart(6, '0');
        }

        function formatCoords(x, y) {
            return `${Math.round(x)}, ${Math.round(y)}`;
        }

        function updateSeedDisplay() {
            _seedHex = formatSeedHex(SESSION_SEED);
            if (document.activeElement !== seedInputEl) seedInputEl.value = _seedHex;
        }

        function getViewCenterWorld() {
            return {
                x: (width  / 2 - camera.x) / camera.zoom,
                y: (height / 2 - camera.y) / camera.zoom
            };
        }

        function updateCoordLabel() {
            const c = getViewCenterWorld();
            _coordStr = formatCoords(c.x, c.y);
            if (!_coordInputFocused) coordInputEl.value = _coordStr;
        }

        function setMouseWorld(w) {
            mouse.x = w.x;
            mouse.y = w.y;
        }

        function resetWorld() {
            activeChunks.clear();
            lastChunkKeys = new Set();
            cacheValid = false;
            draggedNeuron = null;
        }

        function parseSeedInput(raw) {
            const hex = raw.trim().replace(/^#/, '');
            if (!/^[0-9A-Fa-f]{1,6}$/.test(hex)) return null;
            return parseInt(hex, 16);
        }

        function parseCoordInput(raw) {
            const m = raw.trim().match(/^(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)$/);
            if (!m) return null;
            return { x: parseFloat(m[1]), y: parseFloat(m[2]) };
        }

        function applySeed() {
            const parsed = parseSeedInput(seedInputEl.value);
            if (parsed === null) {
                seedInputEl.value = _seedHex;
                return false;
            }
            SESSION_SEED = parsed;
            updateSeedDisplay();
            clearSceneOverrides();
            resetWorld();
            schedulePersistScene();
            return true;
        }

        function centerCameraOn(wx, wy) {
            camera.x = width  / 2 - wx * camera.zoom;
            camera.y = height / 2 - wy * camera.zoom;
            updateCoordLabel();
        }

        function applyCoords() {
            const parsed = parseCoordInput(coordInputEl.value);
            if (!parsed) {
                coordInputEl.value = _coordStr;
                return false;
            }
            centerCameraOn(parsed.x, parsed.y);
            return true;
        }

        function flashCopyBtn(btn) {
            btn.classList.add('copied');
            clearTimeout(btn._fadeTimer);
            btn._fadeTimer = setTimeout(() => btn.classList.remove('copied'), 1400);
        }

        function copyTextSync(text) {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                if (ok) return true;
            } catch { /* fall through */ }
            try {
                navigator.clipboard.writeText(text);
                return true;
            } catch {
                return false;
            }
        }

        function bindCopyBtn(btn, getText, afterCopy) {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                copyTextSync(getText());
                flashCopyBtn(btn);
                afterCopy?.();
            });
        }

        function setupHudField({ inputEl, copyBtn, onApply, getCopyText }) {
            let editStart = '';

            bindCopyBtn(copyBtn, getCopyText);

            inputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    onApply();
                    inputEl.blur();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    inputEl.value = getCopyText();
                    inputEl.blur();
                }
            });

            inputEl.addEventListener('focus', () => {
                editStart = inputEl.value;
                inputEl.select();
            });

            inputEl.addEventListener('blur', () => {
                if (inputEl.value !== editStart) onApply();
                else inputEl.value = getCopyText();
            });
        }

        setupHudField({
            inputEl: seedInputEl,
            copyBtn: document.querySelector('#seedLabel .copyBtn'),
            onApply: applySeed,
            getCopyText: () => _seedHex
        });

        setupHudField({
            inputEl: coordInputEl,
            copyBtn: document.querySelector('#coordLabel .copyBtn'),
            onApply: applyCoords,
            getCopyText: () => _coordStr
        });

        coordInputEl.addEventListener('focus', () => { _coordInputFocused = true; });
        coordInputEl.addEventListener('blur',  () => { _coordInputFocused = false; });

        capacityTextEl.addEventListener('click', (e) => {
            e.preventDefault();
            _capacityMode = (_capacityMode + 1) % 3;
            sessionStorage.setItem('capacityMode', String(_capacityMode));
            updateCapacityHud();
        });

        bindCopyBtn(
            document.getElementById('capacityCopyBtn'),
            getShareUrlSync,
            () => showSceneNotice('Share link copied')
        );

        sceneInfoBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const open = sceneInfoPanel.classList.toggle('show');
            sceneInfoPanel.hidden = !open;
        });

        document.addEventListener('click', (e) => {
            if (!sceneInfoPanel.contains(e.target) && e.target !== sceneInfoBtn)
                sceneInfoPanel.classList.remove('show');
        });

        updateSeedDisplay();
        updateCoordLabel();

        // Deterministic hash: maps (chunk coords + layer + index + field) → [0, 1)
        function chunkRand(cx, cy, layer, i, field) {
            let s = (cx * 73856093 ^ cy * 19349663 ^ layer * 83492791 ^ i * 2654435761 ^ field * 123456789 ^ SESSION_SEED) >>> 0;
            s = Math.imul(s ^ (s >>> 16), 0x45d9f3b) >>> 0;
            s = Math.imul(s ^ (s >>> 16), 0x45d9f3b) >>> 0;
            return ((s ^ (s >>> 16)) >>> 0) / 0xFFFFFFFF;
        }

        class Neuron {
            constructor(layer) {
                this.layer = layer;
                // baseX/baseY/x/y are set by generateChunk after construction
                this.baseX = 0; this.baseY = 0;
                this.x = 0;     this.y = 0;
                this.vx = 0;    this.vy = 0;
                this.pinned = false;
                this.dragScale   = 1.0;
                this.brightScale = 1.0;

                // REVERSED depth — far = larger, foggy
                const reversedLayer = 2 - layer;
                this.size         = 8 + (reversedLayer * 6);
                this.maxSpeed     = 0.3 + (layer * 0.2);
                this.maxSpeedSq   = this.maxSpeed * this.maxSpeed;  // OPT: avoid sqrt in common case
                this.returnForce  = 0.015 + (layer * 0.01);
                this.repelRadius  = 80 + (layer * 40);
                this.repelRadiusSq = this.repelRadius * this.repelRadius; // OPT: squared for guard check
                this.repelForce   = 1.5 + (layer * 0.8);

                // Inner draw threshold (actual line alpha fade distance)
                this.maxDrawDist    = layer === 0 ? 250 : layer === 1 ? 200 : 150;
                this.maxDrawDistSq  = this.maxDrawDist * this.maxDrawDist;
                // Outer cull threshold (skip pair if further than this)
                this.maxConnectionDistSq = (layer === 0 ? 300 : layer === 1 ? 250 : 200) ** 2;

                if (layer === 0) {
                    this.color = colors.neuronLight;
                    this.alpha = 0.25;
                    this.blur  = 8;
                } else if (layer === 1) {
                    this.color = colors.neuronMid;
                    this.alpha = 0.45;
                    this.blur  = 3;
                } else {
                    this.color = colors.neuronDark;
                    this.alpha = 0.7;
                    this.blur  = 0;
                }
            }

            // skipRepel: true while panning so the world-mouse jump doesn't scatter neurons
            update(skipRepel) {
                if (!this.pinned) {
                    // Drift: slowly move the rest position so the network is never fully static.
                    // Y uses a 1.3× freq ratio → Lissajous figure-8 paths instead of circles.
                    const t = performance.now();
                    this.baseX = this.originX + Math.sin(t * this.driftFreq       + this.driftPhaseX) * this.driftAmpX;
                    this.baseY = this.originY + Math.sin(t * this.driftFreq * 1.3 + this.driftPhaseY) * this.driftAmpY;
                }

                if (!skipRepel) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    // OPT: squared guard avoids sqrt for the ~95% of neurons outside repel radius
                    const distSq = dx * dx + dy * dy;
                    if (distSq < this.repelRadiusSq && distSq > 0) {
                        const dist  = Math.sqrt(distSq);
                        const force = (1 - dist / this.repelRadius) * this.repelForce;
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                }

                if (!this.pinned) {
                    const returnDx = this.baseX - this.x;
                    const returnDy = this.baseY - this.y;
                    this.vx += returnDx * this.returnForce;
                    this.vy += returnDy * this.returnForce;
                }

                this.vx *= 0.92;
                this.vy *= 0.92;

                // OPT: squared guard avoids sqrt when already within speed limit
                const speedSq = this.vx * this.vx + this.vy * this.vy;
                if (speedSq > this.maxSpeedSq) {
                    const speed = Math.sqrt(speedSq);
                    this.vx = (this.vx / speed) * this.maxSpeed;
                    this.vy = (this.vy / speed) * this.maxSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;

                this.dragScale   += (1.0 - this.dragScale)   * 0.1;
                this.brightScale += (1.0 - this.brightScale) * 0.1;
            }

            // Cheap AABB — world coords, includes halo radius
            isInViewport(vp) {
                const r = this.size * this.dragScale * 3;
                return this.x + r > vp.left && this.x - r < vp.right &&
                       this.y + r > vp.top  && this.y - r < vp.bottom;
            }

            // dist is passed in from the outer loop (already computed, sqrt already taken)
            drawConnectionTo(other, dist) {
                if (dist >= this.maxDrawDist) return;

                const alpha = (1 - dist / this.maxDrawDist) * this.alpha * 0.3;
                const angle  = Math.atan2(other.y - this.y, other.x - this.x);
                const startX = this.x  + Math.cos(angle) * this.size  * this.dragScale;
                const startY = this.y  + Math.sin(angle) * this.size  * this.dragScale;
                const endX   = other.x - Math.cos(angle) * other.size * other.dragScale;
                const endY   = other.y - Math.sin(angle) * other.size * other.dragScale;

                const midX = (startX + endX) / 2 + (Math.random() - 0.5) * 20;
                const midY = (startY + endY) / 2 + (Math.random() - 0.5) * 20;

                // OPT: solid stroke + globalAlpha instead of createLinearGradient per frame.
                // Visually near-identical at these low alpha values; eliminates gradient
                // object allocation and GPU gradient pipeline per connection.
                ctx.globalAlpha = alpha;
                ctx.strokeStyle = this.color;
                ctx.lineWidth   = this.layer === 0 ? 3 : this.layer === 1 ? 2 : 1.2;
                ctx.lineCap     = 'round';

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(midX, midY, endX, endY);
                ctx.stroke();
            }

            draw() {
                // OPT: radial gradient replaces ctx.filter='blur(Xpx)'.
                // filter changes flush the entire canvas rasterizer; createRadialGradient
                // for ~5 neurons/frame is far cheaper.
                if (this.blur > 0) {
                    const r    = this.size * this.dragScale * 2.5 + this.blur * 1.5;
                    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
                    grad.addColorStop(0,   this.color);
                    grad.addColorStop(0.4, this.color);
                    grad.addColorStop(1,   this.color + '00');
                    ctx.globalAlpha = this.alpha * this.brightScale * 0.2;
                    ctx.fillStyle   = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalAlpha = this.alpha * this.brightScale;
                ctx.fillStyle   = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.dragScale, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalAlpha = this.alpha * this.brightScale * 0.6;
                ctx.fillStyle   = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.dragScale * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ── Chunk management ────────────────────────────────────────────────

        const activeChunks = new Map();
        let lastChunkKeys  = new Set();

        // OPT: cached per-layer neuron arrays — only rebuilt when chunks change,
        // not every frame. Eliminates 3 array allocations + N push() calls/frame.
        const neuronsCache  = [[], [], []];
        let   cacheValid    = false;

        function generateChunk(cx, cy) {
            const neurons = [[], [], []];
            for (let layer = 0; layer < 3; layer++) {
                const count = Math.max(2, Math.round(NEURONS_PER_CHUNK * layerRatios[layer]));
                for (let i = 0; i < count; i++) {
                    const n = new Neuron(layer);
                    n.baseX = n.x = cx * CHUNK_SIZE + chunkRand(cx, cy, layer, i, 0) * CHUNK_SIZE;
                    n.baseY = n.y = cy * CHUNK_SIZE + chunkRand(cx, cy, layer, i, 1) * CHUNK_SIZE;

                    // Drift: each neuron's rest position slowly oscillates so the network
                    // breathes organically. Background neurons drift more (atmospheric),
                    // foreground neurons less (anchored). The existing spring returnForce
                    // chases the moving target — no physics changes needed.
                    n.originX     = n.baseX;
                    n.originY     = n.baseY;
                    const ampScale = layer === 0 ? 1.8 : layer === 1 ? 1.2 : 0.7;
                    n.driftAmpX   = (15 + chunkRand(cx, cy, layer, i, 2) * 35) * ampScale;
                    n.driftAmpY   = (15 + chunkRand(cx, cy, layer, i, 3) * 35) * ampScale;
                    n.driftFreq   = (0.03 + chunkRand(cx, cy, layer, i, 4) * 0.05) * 0.001; // full cycle ~60–180 s
                    n.driftPhaseX = chunkRand(cx, cy, layer, i, 5) * Math.PI * 2;
                    n.driftPhaseY = chunkRand(cx, cy, layer, i, 6) * Math.PI * 2;

                    n.chunkX = cx;
                    n.chunkY = cy;
                    n.index  = i;
                    applyOverrideToNeuron(n, cx, cy, layer, i);

                    neurons[layer].push(n);
                }
            }
            return { neurons };
        }

        function setsEqual(a, b) {
            if (a.size !== b.size) return false;
            for (const k of a) if (!b.has(k)) return false;
            return true;
        }

        function updateChunks(vp) {
            const buf = 1;
            const minCX = Math.floor(vp.left   / CHUNK_SIZE) - buf;
            const maxCX = Math.floor(vp.right  / CHUNK_SIZE) + buf;
            const minCY = Math.floor(vp.top    / CHUNK_SIZE) - buf;
            const maxCY = Math.floor(vp.bottom / CHUNK_SIZE) + buf;

            const required = new Set();
            for (let cx = minCX; cx <= maxCX; cx++)
                for (let cy = minCY; cy <= maxCY; cy++)
                    required.add(`${cx},${cy}`);

            if (setsEqual(required, lastChunkKeys)) return;
            lastChunkKeys = required;
            cacheValid = false; // chunks changed → rebuild neuron cache next frame

            for (const key of activeChunks.keys())
                if (!required.has(key)) activeChunks.delete(key);

            for (const key of required) {
                if (!activeChunks.has(key)) {
                    const [cx, cy] = key.split(',').map(Number);
                    activeChunks.set(key, generateChunk(cx, cy));
                }
            }
        }

        // ── Hit testing ─────────────────────────────────────────────────────

        let draggedNeuron = null;

        function pinNeuron(n) {
            n.x = n.baseX = n.originX = n.x;
            n.y = n.baseY = n.originY = n.y;
            n.vx = n.vy = 0;
            n.pinned = true;
            saveSceneOverride(n.chunkX, n.chunkY, n.layer, n.index, n.x, n.y);
        }

        function getNeuronAt(wx, wy) {
            for (let l = 2; l >= 0; l--) {
                for (const chunk of activeChunks.values()) {
                    for (const n of chunk.neurons[l]) {
                        const dx = n.x - wx, dy = n.y - wy;
                        if (dx * dx + dy * dy <= n.size * n.size) return n;
                    }
                }
            }
            for (let l = 2; l >= 0; l--) {
                for (const chunk of activeChunks.values()) {
                    for (const n of chunk.neurons[l]) {
                        const dx = n.x - wx, dy = n.y - wy;
                        const r = n.blur > 0 ? n.size * 2.5 : n.size;
                        if (dx * dx + dy * dy <= r * r) return n;
                    }
                }
            }
            return null;
        }

        // ── Input handlers ──────────────────────────────────────────────────

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                camera.x = panOrigin.x + (e.clientX - panStart.x);
                camera.y = panOrigin.y + (e.clientY - panStart.y);
            } else {
                const w = screenToWorld(e.clientX, e.clientY);
                setMouseWorld(w);
                if (draggedNeuron) {
                    draggedNeuron.x = w.x;
                    draggedNeuron.y = w.y;
                }
            }
        });

        window.addEventListener('mousedown', (e) => {
            const w = screenToWorld(e.clientX, e.clientY);
            const neuron = getNeuronAt(w.x, w.y);
            if (neuron) {
                draggedNeuron = neuron;
                document.documentElement.style.cursor = 'none';
            } else {
                isPanning = true;
                panStart  = { x: e.clientX, y: e.clientY };
                panOrigin = { x: camera.x,  y: camera.y  };
            }
        });

        window.addEventListener('mouseup', () => {
            if (draggedNeuron) {
                pinNeuron(draggedNeuron);
                draggedNeuron = null;
            }
            isPanning = false;
            document.documentElement.style.cursor = customCursor;
        });

        // ── Touch handling ──────────────────────────────────────────────────
        // Mirrors the mouse/wheel behaviour exactly:
        //   1 finger  → pan canvas  (or drag neuron if starting on one)
        //   2 fingers → pinch-zoom + pan simultaneously, in one transform step

        const _touch = { activeTouches: 0, prevMid: null, prevDist: 0 };

        function _touchMidDist(t1, t2) {
            const mx = (t1.clientX + t2.clientX) * 0.5;
            const my = (t1.clientY + t2.clientY) * 0.5;
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return { mx, my, dist: Math.sqrt(dx * dx + dy * dy) };
        }

        function _releaseDraggedNeuron() {
            if (!draggedNeuron) return;
            pinNeuron(draggedNeuron);
            draggedNeuron = null;
        }

        window.addEventListener('touchstart', (e) => {
            e.preventDefault();
            _touch.activeTouches = e.touches.length;

            if (e.touches.length === 1) {
                const t = e.touches[0];
                const w = screenToWorld(t.clientX, t.clientY);
                setMouseWorld(w);
                const neuron = getNeuronAt(w.x, w.y);
                if (neuron) {
                    draggedNeuron = neuron;
                } else {
                    isPanning = true;
                    panStart  = { x: t.clientX, y: t.clientY };
                    panOrigin = { x: camera.x,  y: camera.y  };
                }
            } else if (e.touches.length === 2) {
                // Second finger lands — cancel any single-touch op cleanly
                _releaseDraggedNeuron();
                isPanning = false;
                const { mx, my, dist } = _touchMidDist(e.touches[0], e.touches[1]);
                _touch.prevMid  = { x: mx, y: my };
                _touch.prevDist = dist;
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();

            if (e.touches.length === 1 && _touch.activeTouches === 1) {
                const t = e.touches[0];
                const w = screenToWorld(t.clientX, t.clientY);
                setMouseWorld(w);
                if (draggedNeuron) {
                    draggedNeuron.x = w.x;
                    draggedNeuron.y = w.y;
                } else if (isPanning) {
                    camera.x = panOrigin.x + (t.clientX - panStart.x);
                    camera.y = panOrigin.y + (t.clientY - panStart.y);
                }

            } else if (e.touches.length === 2 && _touch.prevMid) {
                const { mx, my, dist } = _touchMidDist(e.touches[0], e.touches[1]);

                // Combined pinch+pan in a single transform:
                // anchor the world point under the OLD midpoint to the NEW midpoint.
                // This handles both zoom and translate with no drift.
                const factor  = dist / _touch.prevDist;
                const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, camera.zoom * factor));
                const wx = (_touch.prevMid.x - camera.x) / camera.zoom;
                const wy = (_touch.prevMid.y - camera.y) / camera.zoom;
                camera.zoom = newZoom;
                camera.x    = mx - wx * camera.zoom;
                camera.y    = my - wy * camera.zoom;

                _touch.prevMid  = { x: mx, y: my };
                _touch.prevDist = dist;
            }
        }, { passive: false });

        function _onTouchEnd(e) {
            e.preventDefault();
            _touch.activeTouches = e.touches.length;

            if (e.touches.length < 2) {
                _touch.prevMid  = null;
                _touch.prevDist = 0;
            }

            if (e.touches.length === 0) {
                _releaseDraggedNeuron();
                isPanning = false;
            } else if (e.touches.length === 1) {
                // One finger remains after lifting second — restart single-touch pan
                isPanning = false;
                if (!draggedNeuron) {
                    isPanning = true;
                    panStart  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    panOrigin = { x: camera.x, y: camera.y };
                }
            }
        }

        window.addEventListener('touchend',    _onTouchEnd, { passive: false });
        window.addEventListener('touchcancel', _onTouchEnd, { passive: false });

        function applyZoom(factor, cx, cy) {
            const newZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, camera.zoom * factor));
            const wx = (cx - camera.x) / camera.zoom;
            const wy = (cy - camera.y) / camera.zoom;
            camera.zoom = newZoom;
            camera.x = cx - wx * camera.zoom;
            camera.y = cy - wy * camera.zoom;
        }

        window.addEventListener('wheel', (e) => {
            e.preventDefault();

            if (e.ctrlKey) {
                const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
                applyZoom(factor, e.clientX, e.clientY);
                return;
            }

            const isMouseWheel = e.deltaMode !== 0 ||
                                 (e.deltaX === 0 && Math.abs(e.deltaY) >= 40);

            if (isMouseWheel) {
                const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
                applyZoom(factor, e.clientX, e.clientY);
            } else {
                camera.x -= e.deltaX;
                camera.y -= e.deltaY;
            }
        }, { passive: false });

        window.addEventListener('resize', () => {
            width  = canvas.width  = window.innerWidth;
            height = canvas.height = window.innerHeight;
            updateCoordLabel();
        });

        // ── Render loop ─────────────────────────────────────────────────────

        function animate() {
            if (!_coordInputFocused) updateCoordLabel();

            // 1. Clear
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, width, height);

            // 2. Apply camera transform
            ctx.setTransform(camera.zoom, 0, 0, camera.zoom, camera.x, camera.y);

            const vp = getViewport();

            // 3. Load/unload chunks
            updateChunks(vp);

            // 4. OPT: rebuild neuron cache only when chunks changed, not every frame
            if (!cacheValid) {
                neuronsCache[0].length = 0;
                neuronsCache[1].length = 0;
                neuronsCache[2].length = 0;
                for (const chunk of activeChunks.values())
                    for (let l = 0; l < 3; l++)
                        for (const n of chunk.neurons[l])
                            neuronsCache[l].push(n);
                cacheValid = true;
            }

            // 5. Update, connect, draw — layer by layer (back → front)
            for (let layerIndex = 0; layerIndex < 3; layerIndex++) {
                ctx.filter = 'none';
                const layer = neuronsCache[layerIndex];

                // OPT: physics only for visible neurons — off-screen ones are at rest
                // (return force settles them fast when they re-enter view)
                for (const neuron of layer) {
                    if (neuron !== draggedNeuron && neuron.isInViewport(vp))
                        neuron.update(isPanning);
                }

                // Inflate dragged neuron
                if (draggedNeuron && draggedNeuron.layer === layerIndex) {
                    draggedNeuron.dragScale  += (1.07 - draggedNeuron.dragScale)  * 0.1;
                    draggedNeuron.brightScale += (1.1  - draggedNeuron.brightScale) * 0.1;
                }

                // Connections — OPT: squared distance check avoids sqrt for most pairs;
                // sqrt only taken for the subset that actually gets drawn
                for (let i = 0; i < layer.length; i++) {
                    const a = layer[i];
                    if (!a.isInViewport(vp)) continue; // skip entirely off-screen neurons
                    for (let j = i + 1; j < layer.length; j++) {
                        const b = layer[j];
                        const dx = a.x - b.x, dy = a.y - b.y;
                        const distSq = dx * dx + dy * dy;
                        if (distSq >= a.maxConnectionDistSq) continue;
                        if (!b.isInViewport(vp)) continue; // skip if other end is off-screen
                        a.drawConnectionTo(b, Math.sqrt(distSq));
                    }
                }

                // Draw neurons — skip if outside viewport
                for (const neuron of layer) {
                    if (neuron.isInViewport(vp)) neuron.draw();
                }
            }

            // 6. Reset
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.filter = 'none';
            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }

        async function initScene() {
            const params = new URLSearchParams(location.search);
            const q = params.get('q');
            if (q) {
                try {
                    let data = q.startsWith('{') ? JSON.parse(q) : await decompressSceneParam(q);
                    applyScenePayload(data);
                    return;
                } catch { /* fall through */ }
            }

            const s = params.get('s');
            if (s) {
                const parsed = parseSeedInput(s);
                if (parsed !== null) {
                    SESSION_SEED = parsed;
                    updateSeedDisplay();
                }
                const z = parseFloat(params.get('z'));
                const x = parseFloat(params.get('x'));
                const y = parseFloat(params.get('y'));
                if (!isNaN(z)) camera.zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));
                if (!isNaN(x) && !isNaN(y)) centerCameraOn(x, y);
            }

            try {
                if (!params.has('q') && !params.has('s')) {
                    const stored = localStorage.getItem(SCENE_STORAGE_KEY);
                    if (stored) {
                        const data = JSON.parse(stored);
                        if (data.s === SESSION_SEED && Array.isArray(data.o) && data.o.length)
                            applyScenePayload(data);
                    }
                }
            } catch { /* ignore */ }
        }

        initScene().then(() => {
            updateCoordLabel();
            refreshSceneByteSize();
        });

        animate();
    </script>
</body>
</html>
